# AFLDB-ISSUE-332 (OPS-4) — NOT INSTALLED BY ANY INSTALLER OR SYNC PATH. Owner-installed drop-in, after the notifier template:
#
#   sudo install -m 644 -o root -g root deploy/afldb-settle-failure@.service /etc/systemd/system/afldb-settle-failure@.service
#   sudo install -d -m 755 /etc/systemd/system/afldb-settle-afl-api.service.d
#   sudo install -m 644 -o root -g root deploy/afldb-settle-afl-api.service.d/on-failure.conf \
#        /etc/systemd/system/afldb-settle-afl-api.service.d/on-failure.conf
#   sudo systemctl daemon-reload
#
# The drop-in changes nothing about how the settle runs; it only names the unit systemd starts after a failure. With the
# template absent systemd logs a missing-unit warning and the settle still runs; never install this file first.
# Removal: delete the drop-in file and daemon-reload.
[Unit]
OnFailure=afldb-settle-failure@%n.service
