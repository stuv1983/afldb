// AFLDB-ISSUE-351 — PREPARED, NOT INSTALLED. Install as /etc/apt/apt.conf.d/52-afldb-unattended (root, 0644).
//
// Production's current unattended-upgrades configuration (probed read-only 2026-11-14): Allowed-Origins are the release
// pocket, -security, ESM apps and ESM infra security; no Package-Blacklist; no Automatic-Reboot (so kernels wait for a reboot).
// Timely security updates are KEPT. This file only takes the PostgreSQL server packages out of the unattended set: their
// postinst restarts the cluster (and, through Requires=, the app) regardless of needrestart's configuration, so a PostgreSQL
// security update becomes an owner action in the same owned window as the restart, not an unattended 5 s outage.
// Entries are Python regular expressions matched against package names.
Unattended-Upgrade::Package-Blacklist {
    "postgresql-16";
    "postgresql-client-16";
    "postgresql-common";
    "postgresql-client-common";
};

// Nothing else changes: no Automatic-Reboot (a reboot is a separate owner operation), no timer change.
// To apply a held PostgreSQL update in the owned window: `sudo apt-get install --only-upgrade postgresql-16 postgresql-client-16`
// then `node deploy/release.mjs status` after the restart (docs/deployment.md §3a).
