# AFLDB-ISSUE-351 — PREPARED, NOT INSTALLED. Install as /etc/needrestart/conf.d/50-afldb-hold.conf (root, 0644).
#
# Why: production runs Ubuntu 24.04 with needrestart's STOCK configuration (probed read-only 2026-11-14). From the apt hook
# needrestart's restart mode is 'a' (automatic): /usr/sbin/needrestart resolves "restart = undefined, ui = undefined" to
# restart 'a' under Ubuntu mode, and its override_rc list names neither afldb nor PostgreSQL. So the 06:35 libc6 upgrade of
# 2026-11-14 restarted afldb.service, postgresql@16-main.service and a dozen system services within seconds
# (ActiveEnterTimestamp 06:35:16-06:35:21), and `Requires=postgresql.service` made the app follow the database.
#
# What this does: needrestart will NOT restart these units. Security updates still install on the same schedule
# (unattended-upgrades is untouched); the processes keep running the old libraries until the owner restarts them in an owned
# window (docs/deployment.md §3a "Patching and restarts"). `needrestart -r l` (root, list only) shows what is owed.
#
# Detection: `node deploy/release.mjs host-gate` recognises exactly these two single-line forms (needrestartHold).
$nrconf{override_rc}->{qr(^afldb\.service$)} = 0;
$nrconf{override_rc}->{qr(^postgresql(@.+)?\.service$)} = 0;
