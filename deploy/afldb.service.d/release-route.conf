# AFLDB-ISSUE-329 — production release route (drop-in for deploy/afldb.service).
#
# Install as /etc/systemd/system/afldb.service.d/release-route.conf, then
# `systemctl daemon-reload` and restart. PRODUCTION ONLY: DEV keeps the
# in-place deploy/sync-dev.ps1 route and must not get this file.
#
# The service starts from the release `current` names under the release root
# that deploy/release.mjs maintains, instead of from the checkout's in-place
# .next/standalone, which `next build` deletes before it compiles. systemd
# resolves the symlink once, at start, so a running service stays on the
# release it started in; switching `current` takes effect at the next restart.
# ExecStart= (`node deploy/server-cluster.mjs`, relative) is unchanged and now
# resolves inside that release. EnvironmentFile= (the checkout's .env),
# UnsetEnvironment= and every hardening line stay as the unit sets them.
[Service]
WorkingDirectory=/home/arm/afldb-releases/current

# The server writes ISR output into its own release. The empty assignment
# clears the unit's list (its in-place .next is no longer served); the apex
# directory is re-added exactly as the unit grants it.
ReadWritePaths=
ReadWritePaths=/home/arm/afldb-releases/releases
ReadWritePaths=-/var/www/afldb-soon
