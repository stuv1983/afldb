# R6 r6 (28 Nov 2026): afldb-backup.service drop-in, PREPARED, NOT INSTALLED. Installed by install-attest.sh as
# /etc/systemd/system/afldb-backup.service.d/60-afldb-backup-attest.conf, root:root 0644 (review-fixes-r6-20261128/DESIGN.md 3).
# After ExecStart (User=arm) succeeds, while the run's start job is still live, the root-owned writer records the run's origin from
# PID 1's state in /var/lib/afldb-backup-attest/<invocation>.attest. '+' = this command alone runs as root without the unit's
# sandbox (ExecStart keeps User=arm and every sandbox setting); '-' = a writer failure never fails the backup (no record: the gates
# refuse). env -i and bash --noprofile --norc: no inherited environment, no startup file. Nothing here comes from the checkout.
[Service]
ExecStartPost=-+/usr/bin/env -i PATH=/usr/sbin:/usr/bin /usr/bin/bash --noprofile --norc /usr/local/libexec/afldb/afldb-backup-attest
