# R6 r7 (28 Nov 2026): afldb-backup.service drop-in, PREPARED, NOT INSTALLED. Installed by install-backup.sh as
# /etc/systemd/system/afldb-backup.service.d/70-afldb-backup-sealed.conf, root:root 0644 (review-fixes-r7-20261128/DESIGN.md 2, 3).
# The nightly dump is produced by the system user afldb-backup (no login, no key, no sudo; peer authentication, no secret) into
# /var/lib/afldb-backup/staging, the only path it can write; then the root sealer copies it, seals the run's PID 1 facts and the
# copy's sha256, and publishes the copy root:afldb-backup-read 0440 in /var/lib/afldb-backup/published. Nothing here, and nothing
# the unit executes, is under /home or owned by arm. Every list setting is reset first (empty assignment), so the base unit's
# ExecStart, ReadWritePaths, Environment and SuccessExitStatus no longer apply. '+' = the sealer alone runs as root without the
# sandbox; no '-': a seal or publish failure fails the unit and fires OnFailure=. The timer is unchanged.
[Service]
User=afldb-backup
Group=afldb-backup
SupplementaryGroups=
WorkingDirectory=/
UMask=0077
Environment=
EnvironmentFile=
SuccessExitStatus=
ExecStartPre=
ExecStart=
ExecStart=/usr/bin/bash --noprofile --norc /usr/local/lib/afldb-backup/afldb-backup-run
ExecStartPost=
ExecStartPost=+/usr/bin/env -i PATH=/usr/sbin:/usr/bin /usr/bin/bash --noprofile --norc /usr/local/lib/afldb-backup/afldb-backup-seal
ProtectHome=yes
ProtectSystem=strict
ReadWritePaths=
ReadWritePaths=/var/lib/afldb-backup/staging
NoNewPrivileges=yes
PrivateTmp=yes
