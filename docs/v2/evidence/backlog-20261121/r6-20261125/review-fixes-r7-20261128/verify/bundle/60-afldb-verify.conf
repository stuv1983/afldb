# 60-afldb-verify.conf (R6 r7, MED-2): sshd drop-in, installed by install-verify.sh as /etc/ssh/sshd_config.d/60-afldb-verify.conf.
# The afldb-verify account authenticates ONLY with keys listed in the root-owned file below (never ~/.ssh: its home is root-owned
# and empty), and every session runs the forced command, without a TTY, forwarding, tunnel, user environment or ~/.ssh/rc.
Match User afldb-verify
    AuthorizedKeysFile /etc/ssh/afldb-verify/authorized_keys
    AuthorizedPrincipalsFile none
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    ForceCommand /usr/local/lib/afldb-verify/afldb-verify-entry
    PermitTTY no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitUserRC no
    GatewayPorts no
    PermitListen none
    PermitOpen none
